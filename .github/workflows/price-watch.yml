name: Refresh catalog prices

on:
  schedule:
    # Mondays 13:00 UTC (07:00 CST / 08:00 CDT) — early enough to review before
    # estimates go out that week.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/refresh-prices.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
